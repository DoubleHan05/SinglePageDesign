<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>{{MODEL}} 产品参数单页</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #f4f6f8; font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif; color: #333; }
  @page { size: 1062px 3200px; margin: 0; }
  .page { width: 1022px; margin: 0 auto; padding: 20px; background: #f4f6f8; }

  /* ============ THEME: BLUE ============ */
  body[data-theme="blue"], body[data-theme="blue"] .page { background: #1489E8; }
  body[data-theme="blue"] .brand .brand-text,
  body[data-theme="blue"] .stock,
  body[data-theme="blue"] .stock .sep { color: #ffffff; }
  body[data-theme="blue"] .brand .brand-text { border-left-color: rgba(255,255,255,.5); }
  body[data-theme="blue"] .stock .logo-color { display: none; }
  body[data-theme="blue"] .stock .logo-white { display: block; }
  .stock .logo-white { display: none; }
  .brand .logo-white { display: none; }
  body[data-theme="blue"] .brand .logo-color { display: none; }
  body[data-theme="blue"] .brand .logo-white { display: block; }
  .grid { display: grid; grid-template-columns: 260px 1fr; gap: 16px; align-items: start; }

  .card { background: #fff; border: 1px solid #d9e2ec; border-radius: 4px; }
  .card + .card { margin-top: 16px; }

  /* ============ TOP BAR ============ */
  .topbar { display: grid; grid-template-columns: 260px 1fr; gap: 16px; margin-bottom: 16px; }
  .brand { padding: 14px 8px; display: flex; align-items: center; gap: 12px; min-height: 60px; }
  .brand img { height: 32px; width: auto; display: block; }
  .brand .brand-text { font-size: 24px; font-weight: 600; color: #222; letter-spacing: 1px; line-height: 1; }
  .stock { padding: 14px 8px; display: flex; align-items: center; justify-content: flex-end; gap: 14px; font-size: 24px; color: #333; min-height: 60px; }
  .stock img { height: 32px; width: auto; display: block; }
  .stock .sep { color: #c9d3df; }

  /* ============ LEFT COLUMN ============ */
  .model { min-height: 64px; display: flex; align-items: center; gap: 12px; padding: 14px 18px; font-size: 24px; font-weight: 700; color: #222; }
  .model::before { content: ""; display: block; width: 6px; height: 26px; border-radius: 3px; background: #ff6a2c; flex-shrink: 0; }
  .product-img { padding: 20px; display: flex; align-items: center; justify-content: center; min-height: 260px; }
  .product-img img { max-width: 100%; max-height: 260px; object-fit: contain; }

  .section-title { font-size: 17px; font-weight: 700; color: #222; padding: 18px 22px 6px; }
  .features { padding: 6px 22px 20px; }
  .features li { list-style: none; position: relative; padding-left: 16px; margin: 10px 0; font-size: 13px; line-height: 1.6; color: #444; }
  .features li::before { content: ""; position: absolute; left: 0; top: 7px; width: 8px; height: 8px; background: #ff6a2c; transform: rotate(45deg); border-radius: 1px; }

  .scenes { padding: 10px 22px 22px; display: flex; justify-content: space-around; align-items: flex-start; }
  .scene { flex: 1; text-align: center; min-width: 0; }
  .scene .circle { width: 52px; height: 52px; border-radius: 50%; background: #ff6a2c; color: #fff; font-size: 20px; font-weight: 600; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px; }
  .scene .label { font-size: 12px; color: #555; text-align: center; line-height: 1.4; }

  /* ============ RIGHT COLUMN ============ */
  .table-title { min-height: 64px; display: flex; align-items: center; padding: 14px 18px; font-size: 24px; font-weight: 700; color: #222; text-align: left; }
  .params-wrap { position: relative; }
  .params-wrap .watermark { position: absolute; top: 50%; right: 0; transform: translateY(-50%); width: 45%; height: auto; pointer-events: none; z-index: 2; opacity: 1; }
  .params-wrap .watermark img { display: block; width: 100%; height: auto; }
  table.params { width: 100%; border-collapse: collapse; }
  table.params tr { border-top: 1px solid #eef0f4; }
  table.params td { padding: 14px 18px; font-size: 13px; color: #444; vertical-align: middle; }
  table.params td.k { width: 200px; color: #666; background: #fafbfc; border-right: 1px solid #eef0f4; }
  table.params td.v { color: #333; background: transparent; }
</style>
</head>
<body data-theme="{{THEME}}">
<div class="page">

  <div class="topbar">
    <div class="brand">
      <img class="logo-color" src="../logo/kuaimai_logo.svg" alt="brand logo">
      <img class="logo-white" src="../logo/kuaimai_logo_white.svg" alt="brand logo">
      <span class="brand-text">快麦打印机</span>
    </div>
    <div class="stock">
      <img class="logo-color" src="../logo/guangyun_logo.png" alt="company logo">
      <img class="logo-white" src="../logo/guangyun_logo_white.png" alt="company logo">
      <span class="sep">|</span>
      <span>股票代码：688365</span>
    </div>
  </div>

  <div class="grid">
    <!-- LEFT -->
    <div class="left-col">
      <div class="card">
        <div class="model">{{MODEL}}</div>
      </div>
      <div class="card">
        <div class="product-img"><img src="{{PRODUCT_IMG}}" alt="product"></div>
      </div>
      <div class="card">
        <div class="section-title">产品特点：</div>
        <ul class="features">
          {{FEATURES}}
        </ul>
        <div class="section-title">应用场景：</div>
        <div class="scenes">
          {{SCENES}}
        </div>
      </div>
      <div class="card">
        <div class="section-title">产品细节：</div>
        {{DETAIL_IMGS}}
      </div>
    </div>

    <!-- RIGHT -->
    <div class="right-col">
      <div class="card">
        <div class="table-title">快麦打印机参数表</div>
      </div>
      <div class="card">
        <div class="params-wrap">
          <img class="watermark" src="../logo/watermark.svg" alt="">
          <table class="params">
            {{PARAM_ROWS}}
          </table>
        </div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
